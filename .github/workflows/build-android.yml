name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.11f1

jobs:
  license-check:
    runs-on: ubuntu-latest
    outputs:
      has_license: ${{ steps.check.outputs.has_license }}
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
    steps:
      - id: check
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
            echo "### Android build SKIPPED" >> "$GITHUB_STEP_SUMMARY"
            echo "No UNITY_LICENSE / UNITY_SERIAL secret is set, so no APK was built. See docs/BUILD_ANDROID.md." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Android build skipped: Unity license secrets are not configured."
          fi

  build:
    permissions:
      contents: write
    needs: license-check
    if: needs.license-check.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (Android builds are large)
        uses: jlumbroso/free-disk-space@v1.3.1

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-android-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-android-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: MyFutureCity.EditorTools.BuildScript.BuildAndroid
          buildName: MyFutureCity
          androidExportType: androidPackage
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          allowDirtyBuild: true

      - name: Report APK
        run: |
          echo "### Android build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unity: ${UNITY_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 0.1.${{ github.run_number }} (code ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          ls -la build/Android || true
          if ls build/Android/*.apk >/dev/null 2>&1; then
            for f in build/Android/*.apk; do
              echo "- File: $(basename "$f"), size: $(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "- NO APK FOUND in build/Android" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify native ABIs inside the APK
        run: |
          apk=$(ls build/Android/*.apk | head -n1)
          echo "### APK native ABIs" >> "$GITHUB_STEP_SUMMARY"
          abis=$(unzip -Z1 "$apk" | grep -oE '^lib/[^/]+/' | sort -u)
          echo "$abis" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          echo "$abis"
          echo "$abis" | grep -q 'lib/armeabi-v7a/' || { echo "::error::armeabi-v7a missing (32-bit phones cannot install)"; exit 1; }
          echo "$abis" | grep -q 'lib/arm64-v8a/' || { echo "::error::arm64-v8a missing"; exit 1; }

      # Release assets do not count against the Actions artifact quota, so the APK is always
      # downloadable (Releases page > "latest-apk") even when the artifact upload is refused.
      - name: Publish APK to the rolling latest-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls build/Android/*.apk | head -n1)
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk "$apk" --prerelease \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Rolling build of commit ${GITHUB_SHA}. Universal APK: ARMv7 + ARM64 + x86_64." \
            --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MyFutureCity-android-apk
          path: build/Android
          if-no-files-found: error
          # APKs are large (~53 MB). Keep a short rolling window so routine builds
          # cannot exhaust the repository's GitHub Actions artifact quota.
          retention-days: 1
